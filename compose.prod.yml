services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-migrations:${IMAGE_TAG:?IMAGE_TAG is required}
    command:
      [
        "-path=/migrations",
        "-database",
        "${DATABASE_URL:?DATABASE_URL is required}",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  backend:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped

networks:
  private:
    internal: true

volumes:
  postgres_data:
