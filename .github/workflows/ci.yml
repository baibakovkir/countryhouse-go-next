name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: countryhouse_test
          POSTGRES_USER: countryhouse
          POSTGRES_PASSWORD: countryhouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U countryhouse -d countryhouse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate migration
        env:
          PGPASSWORD: countryhouse_test
        run: psql -h localhost -U countryhouse -d countryhouse_test -v ON_ERROR_STOP=1 -f migrations/000001_init.up.sql
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.4.0
          working-directory: backend
      - run: go test -race -v ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: countryhouse-${{ matrix.name }}:ci

