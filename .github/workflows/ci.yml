name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: countryhouse_test
          POSTGRES_USER: countryhouse
          POSTGRES_PASSWORD: countryhouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U countryhouse -d countryhouse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate migrations
        env:
          PGPASSWORD: countryhouse_test
        run: for migration in migrations/*.up.sql; do psql -h localhost -U countryhouse -d countryhouse_test -v ON_ERROR_STOP=1 -f "$migration"; done
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: backend
      - run: go test -race -v ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: countryhouse-backend
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - name: countryhouse-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=
          - name: countryhouse-migrations
            context: backend
            dockerfile: backend/Dockerfile.migrations
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: registry
        name: Normalize registry owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: images
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
      - name: Upload deployment configuration
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          port="${VM_PORT:-22}"
          scp -i ~/.ssh/id_deploy -P "$port" compose.prod.yml ops/backup.sh "$VM_USER@$VM_HOST:/opt/countryhouse/"
      - name: Deploy immutable release
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -eu
          port="${VM_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$port" "$VM_USER@$VM_HOST" "NEW_IMAGE_TAG=sha-${GITHUB_SHA} sh -s" <<'REMOTE'
            set -eu
            cd /opt/countryhouse
            chmod 750 backup.sh
            set -a
            . ./.env
            set +a
            PUBLIC_APP_URL=${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}

            if [ -f .release.env ]; then
              cp .release.env .release.env.previous
              if docker compose --env-file .env --env-file .release.env -f compose.prod.yml ps --status running --services | grep -qx postgres; then
                ./backup.sh
              fi
            fi

            printf 'IMAGE_TAG=%s\n' "$NEW_IMAGE_TAG" > .release.env.next
            docker compose --env-file .env --env-file .release.env.next -f compose.prod.yml config --quiet
            docker compose --env-file .env --env-file .release.env.next -f compose.prod.yml pull
            mv .release.env.next .release.env

            deployed=true
            docker compose --env-file .env --env-file .release.env -f compose.prod.yml up -d --remove-orphans || deployed=false
            curl --fail --retry 12 --retry-delay 5 http://127.0.0.1:18080/healthz || deployed=false
            curl --fail --retry 12 --retry-delay 5 \
              --connect-to ::127.0.0.1: \
              "${PUBLIC_APP_URL%/}/healthz" || deployed=false

            if [ "$deployed" != true ]; then
              if [ -f .release.env.previous ]; then
                cp .release.env.previous .release.env
                docker compose --env-file .env --env-file .release.env -f compose.prod.yml up -d --remove-orphans
              fi
              exit 1
            fi
          REMOTE
